<div
    class="loader"
    id="portfolioLoader"
    role="status"
    aria-live="polite"
    aria-label="Loading"
>
    <div class="loader-inner">

        <!-- Coffee Cup -->
        <div class="coffee-cup" aria-hidden="true">

            <span class="steam steam-1"></span>
            <span class="steam steam-2"></span>
            <span class="steam steam-3"></span>

            <div class="cup">
                <div class="coffee"></div>
            </div>

        </div>


        <!-- Brand -->
        <div class="loader-brand">
            <span>kiyan</span>.rahmati.dev
        </div>


        <!-- Loading Message -->
        <div
            class="loader-message"
            data-fa="داره لود می‌کنه... یکم صبر کنید"
            data-en="Loading... just a moment"
        >
            Loading... just a moment
        </div>


        <!-- Loading Indicator -->
        <div
            class="loader-progress"
            aria-hidden="true"
        >
            <span></span>
        </div>

    </div>
</div>

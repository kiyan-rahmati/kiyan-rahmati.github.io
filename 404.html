<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <meta
        name="description"
        content="Page not found · Kiyan Rahmati"
    >

    <title>404 · Page Not Found</title>


    <!-- Fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="css/reset.css"
    >

    <link
        rel="stylesheet"
        href="css/variables.css"
    >

    <link
        rel="stylesheet"
        href="css/main.css"
    >

    <link
        rel="stylesheet"
        href="css/animations.css"
    >

    <link
        rel="stylesheet"
        href="css/responsive.css"
    >

</head>


<body>


    <!-- =================================
         NAVBAR
    ================================== -->

    <header class="navbar">

        <div class="container navbar-inner">


            <!-- Logo -->

            <a
                href="./"
                class="logo"
                aria-label="Kiyan Rahmati Home"
            >
                <span>kiyan</span>.rahmati
            </a>


            <!-- Navigation -->

            <nav
                class="nav-links"
                aria-label="Main navigation"
            >

                <a
                    href="./"
                    data-page="home"
                    data-fa="خانه"
                    data-en="Home"
                >
                    Home
                </a>


                <a
                    href="pages/projects/"
                    data-page="projects"
                    data-fa="پروژه‌ها"
                    data-en="Projects"
                >
                    Projects
                </a>


                <a
                    href="pages/articles/"
                    data-page="articles"
                    data-fa="مقالات"
                    data-en="Articles"
                >
                    Articles
                </a>


                <a
                    href="pages/about/"
                    data-page="about"
                    data-fa="درباره من"
                    data-en="About"
                >
                    About
                </a>


                <a
                    href="pages/contact/"
                    data-page="contact"
                    data-fa="تماس"
                    data-en="Contact"
                >
                    Contact
                </a>

            </nav>


            <!-- Actions -->

            <div class="nav-actions">

                <button
                    class="nav-btn language-btn"
                    type="button"
                    data-language-toggle
                    aria-label="Switch language"
                >
                    فارسی
                </button>


                <button
                    class="nav-btn"
                    type="button"
                    data-theme-toggle
                    aria-label="Toggle theme"
                >
                    <span data-theme-icon>☀</span>
                </button>


                <button
                    class="mobile-menu-btn"
                    type="button"
                    aria-label="Open menu"
                    aria-expanded="false"
                >
                    ☰
                </button>

            </div>

        </div>

    </header>


    <!-- =================================
         404 CONTENT
    ================================== -->

    <main>

        <section class="error-page">

            <div class="container">


                <div class="error-content">


                    <!-- Error Code -->

                    <div class="error-code">
                        404
                    </div>


                    <!-- Label -->

                    <div class="section-label">

                        <span>//</span>

                        <span
                            data-fa="صفحه پیدا نشد"
                            data-en="Page Not Found"
                        >
                            Page Not Found
                        </span>

                    </div>


                    <!-- Title -->

                    <h1
                        data-fa="اوه! این صفحه وجود نداره."
                        data-en="Oops! This page doesn't exist."
                    >
                        Oops! This page doesn't exist.
                    </h1>


                    <!-- Description -->

                    <p
                        data-fa="به نظر می‌رسه آدرسی که وارد کردی اشتباهه یا این صفحه جابه‌جا شده."
                        data-en="The page you're looking for may have been moved, deleted or the URL may be incorrect."
                    >
                        The page you're looking for may have
                        been moved, deleted or the URL may be
                        incorrect.
                    </p>


                    <!-- Actions -->

                    <div class="hero-actions">

                        <a
                            href="./"
                            class="btn btn-primary"
                            data-fa="بازگشت به خانه ←"
                            data-en="Back to Home →"
                        >
                            Back to Home →
                        </a>


                        <a
                            href="pages/projects/"
                            class="btn btn-secondary"
                            data-fa="مشاهده پروژه‌ها"
                            data-en="View Projects"
                        >
                            View Projects
                        </a>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- =================================
         FOOTER
    ================================== -->

    <footer class="footer">

        <div class="container footer-inner">

            <div>

                <div class="logo">

                    <span>kiyan</span>.rahmati

                </div>


                <p
                    data-fa="توسعه‌دهنده وب | فرانت‌اند و بک‌اند"
                    data-en="Web Developer | Frontend & Backend"
                >
                    Web Developer | Frontend & Backend
                </p>

            </div>


            <div class="footer-copy">

                © 2026 Kiyan Rahmati

            </div>

        </div>

    </footer>


    <!-- =================================
         SCRIPTS
    ================================== -->

    <script src="js/theme.js"></script>

    <script src="js/language.js"></script>

    <script src="js/app.js"></script>

</body>

</html>

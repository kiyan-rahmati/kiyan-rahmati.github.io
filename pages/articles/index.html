<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Articles about web development, programming and my learning journey."
    >

    <meta
        name="author"
        content="Kiyan Rahmati"
    >

    <title>Articles · Kiyan Rahmati</title>


    <!-- Fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="../../css/reset.css"
    >

    <link
        rel="stylesheet"
        href="../../css/variables.css"
    >

    <link
        rel="stylesheet"
        href="../../css/main.css"
    >

    <link
        rel="stylesheet"
        href="../../css/animations.css"
    >

    <link
        rel="stylesheet"
        href="../../css/responsive.css"
    >

    <link
        rel="stylesheet"
        href="../../components/loader/loader.css"
    >

</head>


<body>

    <!-- Loader -->

    <div id="loader-root"></div>


    <!-- =================================
         NAVBAR
    ================================== -->

    <header class="navbar">

        <div class="container navbar-inner">


            <!-- Logo -->

            <a
                href="../../"
                class="logo"
                aria-label="Kiyan Rahmati Home"
            >
                <span>kiyan</span>.rahmati
            </a>


            <!-- Navigation -->

            <nav
                class="nav-links"
                aria-label="Main navigation"
            >

                <a
                    href="../../"
                    data-page="home"
                    data-fa="خانه"
                    data-en="Home"
                >
                    Home
                </a>


                <a
                    href="../projects/"
                    data-page="projects"
                    data-fa="پروژه‌ها"
                    data-en="Projects"
                >
                    Projects
                </a>


                <a
                    href="../articles/"
                    class="active"
                    data-page="articles"
                    data-fa="مقالات"
                    data-en="Articles"
                    aria-current="page"
                >
                    Articles
                </a>


                <a
                    href="../about/"
                    data-page="about"
                    data-fa="درباره من"
                    data-en="About"
                >
                    About
                </a>


                <a
                    href="../contact/"
                    data-page="contact"
                    data-fa="تماس"
                    data-en="Contact"
                >
                    Contact
                </a>

            </nav>


            <!-- Actions -->

            <div class="nav-actions">


                <!-- Search -->

                <button
                    class="nav-btn"
                    type="button"
                    data-search-open
                    aria-label="Search"
                    title="Search"
                >
                    ⌕
                </button>


                <!-- Language -->

                <button
                    class="nav-btn language-btn"
                    type="button"
                    data-language-toggle
                    aria-label="Switch language"
                >
                    فارسی
                </button>


                <!-- Theme -->

                <button
                    class="nav-btn"
                    type="button"
                    data-theme-toggle
                    aria-label="Toggle theme"
                >
                    <span data-theme-icon>☀</span>
                </button>


                <!-- Mobile Menu -->

                <button
                    class="mobile-menu-btn"
                    type="button"
                    aria-label="Open menu"
                    aria-expanded="false"
                >
                    ☰
                </button>

            </div>

        </div>

    </header>


    <!-- =================================
         MAIN
    ================================== -->

    <main>


        <!-- Page Hero -->

        <section class="page-hero">

            <div class="container">

                <div class="section-label">

                    <span>//</span>

                    <span
                        data-fa="مقالات"
                        data-en="Articles"
                    >
                        Articles
                    </span>

                </div>


                <h1
                    data-fa="یادداشت‌ها و مقالات"
                    data-en="Articles & Notes"
                >
                    Articles & Notes
                </h1>


                <p
                    data-fa="یادداشت‌هایی درباره توسعه وب، برنامه‌نویسی و چیزهایی که در مسیر یادگیری تجربه می‌کنم."
                    data-en="Notes about web development, programming and things I learn along the way."
                >
                    Notes about web development,
                    programming and things I learn
                    along the way.
                </p>

            </div>

        </section>


        <!-- =================================
             ARTICLES
        ================================== -->

        <section class="section">

            <div class="container">

                <div
                    id="articlesGrid"
                    class="article-grid"
                >

                    <div class="loading">

                        Loading articles...

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- =================================
         FOOTER
    ================================== -->

    <footer class="footer">

        <div class="container footer-inner">


            <div>

                <div class="logo">

                    <span>kiyan</span>.rahmati

                </div>


                <p
                    data-fa="توسعه‌دهنده وب | فرانت‌اند و بک‌اند"
                    data-en="Web Developer | Frontend & Backend"
                >
                    Web Developer | Frontend & Backend
                </p>

            </div>


            <div class="footer-links">

                <a
                    href="https://github.com/kiyan-rahmati"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    GitHub
                </a>


                <a
                    href="../contact/"
                    data-fa="همکاری"
                    data-en="Work with me"
                >
                    Work with me
                </a>

            </div>


            <div class="footer-copy">

                © 2026 Kiyan Rahmati

            </div>

        </div>

    </footer>


    <!-- =================================
         SEARCH OVERLAY
    ================================== -->

    <div
        id="searchOverlay"
        class="search-overlay"
        aria-hidden="true"
    >

        <div class="search-box">


            <div class="search-header">

                <strong
                    data-fa="جستجو"
                    data-en="Search"
                >
                    Search
                </strong>


                <button
                    type="button"
                    data-search-close
                    aria-label="Close search"
                >
                    ×
                </button>

            </div>


            <input
                class="search-input"
                type="search"
                autocomplete="off"
                placeholder="Search..."
                data-placeholder-fa="جستجو..."
                data-placeholder-en="Search..."
            >


            <div class="search-results"></div>

        </div>

    </div>


    <!-- =================================
         SCRIPTS
    ================================== -->

    <script src="../../js/theme.js"></script>

    <script src="../../js/language.js"></script>

    <script src="../../js/search.js"></script>

    <script src="../../js/github.js"></script>

    <script src="../../js/pages.js"></script>

    <script src="../../js/app.js"></script>

    <script src="../../components/loader/loader.js"></script>

</body>

</html>
